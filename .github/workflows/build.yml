name: Build standalone binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win
            runner: windows-latest
            target: node20-win-x64
            output: release/win/elevenlabs-auto-voiceover.exe
          - name: mac
            runner: macos-latest
            target: node20-macos-arm64
            output: release/mac/elevenlabs-auto-voiceover
          - name: linux
            runner: ubuntu-latest
            target: node20-linux-x64
            output: release/linux/elevenlabs-auto-voiceover
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bundle
        run: npm run bundle

      - name: Prepare output dir
        run: node -e "require('fs').mkdirSync('release/${{ matrix.name }}',{recursive:true})"

      - name: Package binary
        run: npx -y @yao-pkg/pkg build/bundle.cjs --targets ${{ matrix.target }} --output ${{ matrix.output }}

      - name: Copy assets next to binary
        run: node scripts/copy-assets.mjs ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-auto-voiceover-${{ matrix.name }}
          path: release/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
