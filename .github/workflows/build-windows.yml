name: Сборка для Windows

on:
  workflow_dispatch:
  push:
    branches: ["cursor/elevenlabs-api-voiceover-gui-edb4"]
    paths:
      - "elevenlabs_voiceover/**"
      - "app.py"
      - "requirements.txt"
      - "samples/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Собрать exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ElevenLabsVoiceover
          --hidden-import tkinter
          app.py

      - name: Проверить, что exe запускается
        shell: pwsh
        run: |
          $exe = "dist\ElevenLabsVoiceover.exe"
          if (-not (Test-Path $exe)) { throw "exe не собрался" }

          # Сборка идёт без консоли, поэтому оболочка не ждёт процесс сама и
          # не заполняет $LASTEXITCODE. Ждём явно и смотрим код возврата.
          function Invoke-Exe([string[]] $Arguments) {
            $process = Start-Process -FilePath $exe -ArgumentList $Arguments `
              -Wait -PassThru -NoNewWindow
            return $process.ExitCode
          }

          $code = Invoke-Exe @("--estimate", "--prompts", "samples\prompts",
                               "--texts", "samples\texts", "--output", "out")
          if ($code -ne 0) { throw "оценка объёма завершилась с кодом $code" }

          # На вывод в консоль полагаться нельзя, поэтому берём действие со
          # следом на диске: сбор отчёта поднимает логи, базу и упаковку в zip.
          $reports = "$env:APPDATA\ElevenLabsVoiceover\reports"
          if (Test-Path $reports) { Remove-Item "$reports\*.zip" -Force }

          $code = Invoke-Exe @("--report")
          if ($code -ne 0) { throw "сбор отчёта завершился с кодом $code" }

          $made = @(Get-ChildItem "$reports\*.zip" -ErrorAction SilentlyContinue)
          if ($made.Count -eq 0) { throw "отчёт не появился, сборка нерабочая" }

          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "exe собран и работает: $size МБ, отчёт $($made[0].Name)"

      - name: Собрать комплект для раздачи
        shell: pwsh
        run: |
          # Раскладка сразу готова к работе: три папки, которые остаётся
          # указать в окне, и примеры внутри двух из них.
          New-Item -ItemType Directory -Force -Path `
            package\промпты, package\тексты, package\готово | Out-Null

          Copy-Item dist\ElevenLabsVoiceover.exe package\
          Copy-Item README.md package\
          Copy-Item samples\prompts\*.txt package\промпты\
          Copy-Item samples\texts\*.txt package\тексты\

          # Пустые папки в zip не попадают, поэтому кладём пояснение внутрь.
          Set-Content -Path package\готово\'что здесь будет.txt' -Encoding UTF8 -Value @'
          Сюда лягут готовые mp3.

          Рядом появятся папка _voices с вариантами созданных голосов,
          которые можно послушать, и таблица _manifest.csv с тем, какой
          файл каким голосом озвучен.

          Этот файл можно удалить.
          '@

          Compress-Archive -Path package\* -DestinationPath ElevenLabsVoiceover-windows.zip -Force
          $size = [math]::Round((Get-Item ElevenLabsVoiceover-windows.zip).Length / 1MB, 1)
          Write-Host "комплект собран, $size МБ"

      - uses: actions/upload-artifact@v4
        with:
          name: ElevenLabsVoiceover-windows
          path: |
            dist/ElevenLabsVoiceover.exe
            ElevenLabsVoiceover-windows.zip
          retention-days: 90

      - name: Выложить в релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes=$(cat <<'EOF'
          Готовая сборка для Windows. Python устанавливать не нужно.

          **ElevenLabsVoiceover-windows.zip** — рекомендуемый вариант. Внутри
          программа, готовые папки `промпты`, `тексты`, `готово` с примерами
          и инструкция. Распакуйте и запустите `ElevenLabsVoiceover.exe`.

          **ElevenLabsVoiceover.exe** — только программа, если папки уже есть.

          Перед первым запуском создайте API-ключ на странице
          [API Keys](https://elevenlabs.io/app/developers/api-keys) и обязательно
          отметьте разрешения **Text to Speech**, **Voices** и **User** — по
          умолчанию ключ создаётся ограниченным и работать не будет.

          Настройки и журналы хранятся в `%APPDATA%\ElevenLabsVoiceover`,
          поэтому замена exe их не затрагивает.

          Windows SmartScreen может предупредить о неизвестном издателе:
          сборка не подписана сертификатом. Нажмите «Подробнее» и
          «Выполнить в любом случае».

          Сборка обновляется автоматически при каждом изменении кода.
          EOF
          )
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release upload windows-latest \
              dist/ElevenLabsVoiceover.exe ElevenLabsVoiceover-windows.zip --clobber
            gh release edit windows-latest --notes "$notes"
          else
            gh release create windows-latest \
              dist/ElevenLabsVoiceover.exe ElevenLabsVoiceover-windows.zip \
              --title "Озвучка ElevenLabs — сборка для Windows" \
              --notes "$notes" \
              --prerelease \
              --target "${{ github.sha }}"
          fi
