[project]
name = "tgparser"
version = "0.1.0"
description = "Парсер участников тематических чатов и каналов Telegram"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S", "BLE"]
ignore = [
    "E501",    # длину строк держим руками, форматтер не гоняем
    "RUF001",  # кириллица в строках — это интерфейс, не опечатка
    "RUF002",
    "RUF003",
    "B008",
    "SIM108",
    "S311",    # random нужен для джиттера, а не для криптографии
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "SIM117"]
# S105 срабатывает на именах членов перечисления со словом PASSWORD.
"tgparser/userbot/auth.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
