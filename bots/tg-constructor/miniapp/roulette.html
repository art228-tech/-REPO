<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка звёзд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --gold: #FFD700; --bg: #0D0D1A; }

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Stars background */
.stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.star-dot {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--d) var(--delay) ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.9; } }

/* Main */
.screen {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 400px;
  padding: 12px 16px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* Title */
.title h1 {
  font-family: 'Russo One', sans-serif;
  font-size: 24px;
  color: var(--gold);
  text-align: center;
  text-shadow: 0 0 30px rgba(255,215,0,0.7);
  letter-spacing: 1px;
}
.title p { color: rgba(255,255,255,0.5); font-size: 13px; text-align: center; margin-top: 4px; }

/* Wheel */
.wheel-wrap {
  position: relative;
  width: 280px;
  height: 280px;
}
.glow-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: conic-gradient(#FFD700, #9333EA, #FFD700, #9333EA, #FFD700);
  animation: spinRing 3s linear infinite;
  filter: blur(8px);
  opacity: 0.6;
}
@keyframes spinRing { to { transform: rotate(360deg); } }
.glow-ring2 {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(#FFD700, #9333EA, #FFD700, #9333EA, #FFD700);
  animation: spinRing 3s linear infinite;
}
canvas#wheel {
  position: relative;
  z-index: 2;
  border-radius: 50%;
  display: block;
}
.hub {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  width: 58px; height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #2D1060, #0D0D1A);
  border: 3px solid rgba(255,215,0,0.7);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 15px rgba(255,215,0,0.4) inset;
}
.ptr {
  position: absolute;
  top: -4px; left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  width: 0; height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 30px solid #FFD700;
  filter: drop-shadow(0 2px 8px rgba(255,215,0,1));
  transition: transform 0.08s;
}

/* Spin button */
.spin-btn {
  width: 280px;
  padding: 17px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #FF8C00, #FFD700, #FF8C00);
  background-size: 200%;
  color: #1A0800;
  font-family: 'Russo One', sans-serif;
  font-size: 19px;
  letter-spacing: 1px;
  cursor: pointer;
  overflow: hidden;
  position: relative;
  box-shadow: 0 6px 32px rgba(255,140,0,0.6);
  animation: btnGlow 2s ease-in-out infinite;
  transition: transform 0.1s;
}
@keyframes btnGlow {
  0%,100% { box-shadow: 0 6px 32px rgba(255,140,0,0.5); }
  50% { box-shadow: 0 6px 50px rgba(255,200,0,0.9); }
}
.spin-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: skewX(-20deg);
  animation: shine 1.8s infinite;
}
@keyframes shine { to { left: 200%; } }
.spin-btn:active { transform: scale(0.96); }
.spin-btn:disabled { opacity: 0.45; animation: none; cursor: not-allowed; }
.spin-btn:disabled::before { display: none; }

/* ═══════════════════════════
   WIN SCREEN
   ═══════════════════════════ */
.win-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(ellipse at 50% 40%, #2D0080 0%, #0D0D1A 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s;
  overflow: hidden;
}
.win-screen.show { opacity: 1; pointer-events: all; }

/* Radial burst */
.burst {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 600px; height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
  animation: burstPulse 2s ease-in-out infinite;
}
@keyframes burstPulse {
  0%,100% { transform: translate(-50%,-50%) scale(0.8); opacity: 0.6; }
  50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
}

.win-congrats {
  font-family: 'Russo One', sans-serif;
  font-size: 22px;
  color: white;
  letter-spacing: 2px;
  text-align: center;
  z-index: 1;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.5s 0.3s;
}
.win-screen.show .win-congrats { opacity: 1; transform: translateY(0); }

.win-star {
  font-size: 90px;
  z-index: 1;
  filter: drop-shadow(0 0 40px rgba(255,215,0,1));
  animation: starSpin 3s linear infinite;
  opacity: 0;
  transition: opacity 0.5s 0.5s;
}
.win-screen.show .win-star { opacity: 1; }
@keyframes starSpin {
  0%,100% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 40px rgba(255,215,0,0.8)); }
  50% { transform: scale(1.15) rotate(5deg); filter: drop-shadow(0 0 80px rgba(255,215,0,1)); }
}

.win-num {
  font-family: 'Russo One', sans-serif;
  font-size: 96px;
  line-height: 1;
  background: linear-gradient(180deg, #FFF176 0%, #FFD700 50%, #FF8C00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 20px rgba(255,215,0,0.8));
  z-index: 1;
  opacity: 0;
  transform: scale(0.3);
  transition: all 0.7s 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
}
.win-screen.show .win-num { opacity: 1; transform: scale(1); }

.win-sub {
  font-family: 'Russo One', sans-serif;
  font-size: 20px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 4px;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.5s 0.9s;
}
.win-screen.show .win-sub { opacity: 1; }

.claim-btn {
  margin-top: 24px;
  width: calc(100% - 48px);
  max-width: 340px;
  padding: 22px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #FF8C00, #FFD700, #FF8C00);
  background-size: 200%;
  color: #1A0800;
  font-family: 'Russo One', sans-serif;
  font-size: 20px;
  letter-spacing: 1px;
  cursor: pointer;
  z-index: 1;
  box-shadow: 0 8px 50px rgba(255,165,0,0.8);
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(30px);
  transition: all 0.6s 1s;
  animation: claimGlow 1.5s ease-in-out infinite 1.6s;
}
.win-screen.show .claim-btn { opacity: 1; transform: translateY(0); }
@keyframes claimGlow {
  0%,100% { box-shadow: 0 8px 50px rgba(255,165,0,0.7); }
  50% { box-shadow: 0 8px 80px rgba(255,220,0,1); }
}
.claim-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: skewX(-20deg);
  animation: shine 1.5s infinite;
}
.claim-btn:active { transform: scale(0.97) translateY(0) !important; }

/* Confetti */
.cpiece {
  position: absolute;
  animation: cfall var(--d) var(--dl) ease-in forwards;
  border-radius: var(--r);
  z-index: 0;
}
@keyframes cfall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(0); }
  10% { transform: translateY(60px) rotate(90deg) scale(1); opacity: 1; }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- MAIN -->
<div class="screen" id="mainScreen">
  <div class="title">
    <h1>⭐ ЗВЁЗДНАЯ РУЛЕТКА</h1>
    <p>Крути и забирай свой приз!</p>
  </div>

  <div class="wheel-wrap">
    <div class="glow-ring"></div>
    <div class="glow-ring2"></div>
    <canvas id="wheel" width="280" height="280"></canvas>
    <div class="hub">⭐</div>
    <div class="ptr" id="ptr"></div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="startSpin()">🎰 КРУТИТЬ</button>
</div>

<!-- WIN SCREEN -->
<div class="win-screen" id="winScreen">
  <div class="burst"></div>
  <div class="win-congrats">🎉 ПОЗДРАВЛЯЕМ! 🎉</div>
  <div class="win-star">⭐</div>
  <div class="win-num">5000</div>
  <div class="win-sub">З В Ё З Д</div>
  <button class="claim-btn" onclick="claim()">✨ ЗАБРАТЬ ПРИЗ</button>
</div>

<script>
// Telegram
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setBackgroundColor('#0D0D1A'); tg.setHeaderColor('#0D0D1A'); }

// Stars bg
(function(){
  const s = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'star-dot';
    const sz = Math.random() > 0.8 ? 2 : 1;
    d.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;`;
    s.appendChild(d);
  }
})();

// ── Segments (1 jackpot only) ─────────────────────────────
const SEG = [
  { v: '30',   bg: '#5C4FE8', fg: '#fff' },
  { v: '100',  bg: '#E8504A', fg: '#fff' },
  { v: '40',   bg: '#49C0F0', fg: '#fff' },
  { v: '30',   bg: '#A855F7', fg: '#fff' },
  { v: '5000', bg: '#FFD700', fg: '#1A0800' },  // JACKPOT
  { v: '40',   bg: '#10B981', fg: '#fff' },
  { v: '100',  bg: '#F59E0B', fg: '#fff' },
  { v: '30',   bg: '#EC4899', fg: '#fff' },
];

const N = SEG.length;
const ARC = (Math.PI * 2) / N;
const cv = document.getElementById('wheel');
const cx = cv.getContext('2d');
const CX = cv.width / 2, CY = cv.height / 2, R = CX - 4;

let angle = 0, spinning = false, won = false;

function draw(a) {
  cx.clearRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < N; i++) {
    const s = a + i * ARC, e = s + ARC;
    const sg = SEG[i];
    const isJack = sg.v === '5000';

    cx.beginPath();
    cx.moveTo(CX, CY);
    cx.arc(CX, CY, R, s, e);
    cx.closePath();
    cx.fillStyle = sg.bg;
    cx.fill();
    cx.strokeStyle = 'rgba(0,0,0,0.35)';
    cx.lineWidth = 2;
    cx.stroke();

    // Jackpot shimmer
    if (isJack) {
      cx.save();
      cx.beginPath();
      cx.moveTo(CX, CY);
      cx.arc(CX, CY, R, s, e);
      cx.closePath();
      cx.clip();
      const grad = cx.createRadialGradient(CX, CY, 0, CX, CY, R);
      grad.addColorStop(0, 'rgba(255,255,255,0.2)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      cx.fillStyle = grad;
      cx.fill();
      cx.restore();
    }

    // Text
    cx.save();
    cx.translate(CX, CY);
    cx.rotate(s + ARC / 2);
    cx.textAlign = 'right';
    cx.fillStyle = sg.fg;
    cx.font = isJack ? 'bold 14px Russo One, sans-serif' : 'bold 12px Russo One, sans-serif';
    cx.shadowColor = 'rgba(0,0,0,0.7)';
    cx.shadowBlur = 4;
    cx.fillText(isJack ? '⭐ 5000' : sg.v + ' ⭐', R - 8, 5);
    cx.restore();
  }

  // Outer ring
  cx.beginPath();
  cx.arc(CX, CY, R, 0, Math.PI * 2);
  cx.strokeStyle = 'rgba(255,215,0,0.5)';
  cx.lineWidth = 3;
  cx.stroke();

  // Center
  cx.beginPath();
  cx.arc(CX, CY, 32, 0, Math.PI * 2);
  cx.fillStyle = '#0D0D1A';
  cx.fill();
  cx.strokeStyle = 'rgba(255,215,0,0.6)';
  cx.lineWidth = 2;
  cx.stroke();
}

draw(0);

// ── Target: jackpot at index 4 ────────────────────────────
function getTarget() {
  const mid = (4 + 0.5) * ARC; // jackpot midpoint
  const ptr = -Math.PI / 2;
  let t = ptr - mid;
  t = ((t % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  return t + (7 + Math.floor(Math.random() * 5)) * Math.PI * 2;
}

function ease(t) { return 1 - Math.pow(1 - t, 5); }

let lastSeg = -1;
function tick() {
  const p = document.getElementById('ptr');
  p.style.transform = 'translateX(-50%) scale(1.4)';
  setTimeout(() => p.style.transform = 'translateX(-50%) scale(1)', 70);
}

function startSpin() {
  if (spinning || won) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

  const total = getTarget();
  const dur = 5200 + Math.random() * 800;
  const start = angle;
  const t0 = performance.now();

  function frame(now) {
    const t = Math.min((now - t0) / dur, 1);
    angle = start + total * ease(t);
    draw(angle);

    const norm = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const cur = Math.floor(((Math.PI * 2 - norm) % (Math.PI * 2)) / ARC) % N;
    if (cur !== lastSeg) { lastSeg = cur; tick(); }

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false; won = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      setTimeout(showWin, 500);
    }
  }
  requestAnimationFrame(frame);
}

function showWin() {
  document.getElementById('winScreen').classList.add('show');
  // Confetti
  const ws = document.getElementById('winScreen');
  const colors = ['#FFD700','#FF6B6B','#A855F7','#3B82F6','#10B981','#F97316','#FFF176'];
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div');
    el.className = 'cpiece';
    el.style.cssText = `
      left:${Math.random()*100}%;top:0;
      width:${5+Math.random()*10}px;height:${5+Math.random()*10}px;
      background:${colors[~~(Math.random()*colors.length)]};
      --r:${Math.random()>.5?'50%':'2px'};
      --d:${1.5+Math.random()*2.5}s;
      --dl:${Math.random()*.8}s;
    `;
    ws.appendChild(el);
  }
  setTimeout(() => ws.querySelectorAll('.cpiece').forEach(e => e.remove()), 5000);
}

function claim() {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('heavy');
  if (tg) {
    tg.sendData(JSON.stringify({ action: 'claimed', prize: 5000 }));
  } else {
    alert('5000 звёзд забраны! (dev)');
  }
}
</script>
</body>
</html>
