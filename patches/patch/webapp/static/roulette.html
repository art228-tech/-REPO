<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Звёздная рулетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#1f0848;
    --bg-bot:#0c031f;
    --gold-1:#fff5b8;
    --gold-2:#ffd152;
    --gold-3:#c97a00;
    --magenta:#ff3aa1;
    --violet:#7a3eff;
    --cyan:#4de4ff;
    --green:#22c476;
    --orange:#ff9b1a;
    --red:#e8324a;
    --pink:#ff5eb4;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    font-family:'Manrope', system-ui, sans-serif;
    color:#fff;
    background:
      radial-gradient(120% 80% at 50% -10%, #4b1c9a 0%, transparent 60%),
      radial-gradient(80% 60% at 100% 100%, #ff3aa133 0%, transparent 60%),
      radial-gradient(70% 60% at 0% 100%, #4de4ff22 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    min-height:100vh; min-height:100dvh;
    overflow:hidden; position:relative; user-select:none; -webkit-user-select:none;
  }
  /* Звёзды */
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .stars i{
    position:absolute;
    background:#fff; border-radius:50%;
    box-shadow:0 0 6px rgba(255,255,255,.9), 0 0 14px rgba(255,200,80,.5);
    animation:twinkle var(--d,3s) infinite ease-in-out;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(.7)}
    50%{opacity:1; transform:scale(1.2)}
  }
  /* Звёздные иконки крупные */
  .bigstar{position:absolute; pointer-events:none; opacity:.55;
    filter:drop-shadow(0 0 16px rgba(255,200,80,.7));
    animation:floaty 7s infinite ease-in-out;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-12px) rotate(8deg)}
  }

  .stage{
    position:relative; z-index:1;
    display:flex; flex-direction:column;
    align-items:center;
    min-height:100vh; min-height:100dvh;
    padding:20px 16px 18px;
    text-align:center;
  }

  .topbadge{
    display:flex; align-items:center; gap:10px;
    margin-top:6px;
  }
  .topbadge .ico{
    font-size:28px;
    filter:drop-shadow(0 0 12px rgba(255,210,80,.9));
  }
  .title{
    font-family:'Russo One', sans-serif;
    font-size:38px;
    line-height:1;
    letter-spacing:1px;
    background:linear-gradient(180deg, #fff 0%, var(--gold-1) 35%, var(--gold-2) 70%, var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 4px 14px rgba(255,180,40,.35);
  }
  .subtitle{
    margin-top:8px;
    font-size:14px; color:rgba(255,255,255,.78);
    letter-spacing:.4px;
  }
  .pill{
    margin-top:14px;
    display:inline-flex; align-items:center; gap:10px;
    padding:9px 18px;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 100%);
    border:1px solid rgba(255,213,82,.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.15),
      0 6px 22px rgba(122,62,255,.3);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .pill .dot{
    width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--gold-2) 60%, transparent 80%);
    box-shadow:0 0 12px var(--gold-2);
  }
  .pill .lbl{
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(255,255,255,.85);
    font-weight:800;
  }
  .pill .val{
    font-family:'Russo One', sans-serif;
    font-size:18px;
    color:var(--gold-1);
    text-shadow:0 0 12px rgba(255,210,80,.6);
  }
  .pill .star{
    font-size:18px;
    filter:drop-shadow(0 0 6px var(--gold-2));
  }

  .wheel-wrap{
    position:relative;
    margin:22px auto 0;
    width:min(86vw, 380px);
    aspect-ratio:1;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute; inset:-14px;
    border-radius:50%;
    background:
      conic-gradient(from 0deg, var(--gold-1), var(--gold-3), var(--gold-1), var(--gold-3), var(--gold-1));
    filter:drop-shadow(0 0 26px rgba(255,210,80,.5));
  }
  .ring::before{
    content:""; position:absolute; inset:7px; border-radius:50%;
    background:radial-gradient(circle, #1a0a36 0%, #0a0420 100%);
  }
  .bulbs{position:absolute; inset:0; pointer-events:none;}
  .bulbs span{
    position:absolute;
    width:8px; height:8px;
    background:radial-gradient(circle, #fff 0%, var(--gold-1) 55%, transparent 80%);
    border-radius:50%;
    box-shadow:0 0 10px var(--gold-1), 0 0 18px rgba(255,210,80,.85);
    animation:bulb 1.8s infinite ease-in-out;
  }
  @keyframes bulb{
    0%,100%{opacity:.3; transform:translate(-50%,-50%) scale(.7)}
    50%{opacity:1; transform:translate(-50%,-50%) scale(1.25)}
  }
  canvas#wheel{
    position:relative;
    width:90%; height:90%;
    border-radius:50%;
    filter:drop-shadow(0 18px 32px rgba(0,0,0,.55));
  }

  .pointer{
    position:absolute; left:50%; top:-2px;
    transform:translateX(-50%);
    z-index:5;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));
  }

  .hub{
    position:absolute; left:50%; top:50%;
    width:80px; height:80px; margin:-40px 0 0 -40px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, #fff7d0 0%, var(--gold-1) 35%, var(--gold-2) 70%, var(--gold-3) 100%);
    box-shadow:
      inset 0 -8px 14px rgba(0,0,0,.4),
      inset 0 5px 10px rgba(255,255,255,.7),
      0 0 28px rgba(255,210,80,.6);
    display:flex; align-items:center; justify-content:center;
    z-index:4;
    overflow:hidden;
  }
  .hub svg{width:55%; height:55%; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}

  .spin-btn{
    margin-top:auto;
    width:min(86vw, 380px);
    height:64px;
    border:0; border-radius:18px;
    font-family:'Manrope', sans-serif;
    font-weight:800; font-size:18px; letter-spacing:1px;
    color:#190628;
    background:linear-gradient(180deg, #fff7d0 0%, var(--gold-1) 45%, var(--gold-2) 100%);
    box-shadow:
      0 14px 32px rgba(255,180,40,.55),
      inset 0 2px 0 rgba(255,255,255,.7),
      inset 0 -3px 0 rgba(120,60,0,.25);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .12s ease, box-shadow .2s ease;
    text-transform:uppercase;
  }
  .spin-btn:active{transform:translateY(2px) scale(.99); box-shadow:0 8px 18px rgba(255,180,40,.45);}
  .spin-btn[disabled]{opacity:.6; cursor:not-allowed; transform:none}
  .spin-btn::after{
    content:""; position:absolute; left:-60%; top:0;
    width:50%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform:skewX(-25deg);
    animation:shine 2.2s infinite;
  }
  @keyframes shine{
    0%{left:-60%}
    65%{left:140%}
    100%{left:140%}
  }

  /* Экран победы */
  .win-screen{
    position:fixed; inset:0; z-index:10;
    background:
      radial-gradient(70% 50% at 50% 35%, rgba(255,200,60,.35) 0%, transparent 65%),
      radial-gradient(80% 60% at 50% 80%, rgba(155,77,255,.30) 0%, transparent 60%),
      linear-gradient(180deg, #15001f 0%, #060010 100%);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .win-screen.show{opacity:1; pointer-events:auto}
  .win-screen .rays{
    position:absolute; inset:0; pointer-events:none;
    background:conic-gradient(from 0deg,
      transparent 0deg, rgba(255,210,80,.20) 8deg, transparent 16deg,
      transparent 35deg, rgba(255,210,80,.15) 43deg, transparent 51deg,
      transparent 70deg, rgba(255,210,80,.20) 78deg, transparent 86deg,
      transparent 105deg, rgba(255,210,80,.18) 113deg, transparent 121deg,
      transparent 140deg, rgba(255,210,80,.22) 148deg, transparent 156deg,
      transparent 175deg, rgba(255,210,80,.18) 183deg, transparent 191deg,
      transparent 210deg, rgba(255,210,80,.20) 218deg, transparent 226deg,
      transparent 245deg, rgba(255,210,80,.16) 253deg, transparent 261deg,
      transparent 280deg, rgba(255,210,80,.22) 288deg, transparent 296deg,
      transparent 315deg, rgba(255,210,80,.18) 323deg, transparent 331deg,
      transparent 350deg, rgba(255,210,80,.20) 358deg, transparent 360deg);
    animation:rotrays 30s linear infinite;
    mix-blend-mode:screen; opacity:.5;
  }
  @keyframes rotrays{
    0%{transform:rotate(0)}
    100%{transform:rotate(360deg)}
  }
  .win-title{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Russo One', sans-serif;
    font-size:26px;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 0 18px rgba(255,200,60,.8), 0 2px 6px rgba(0,0,0,.6);
    animation:popin .8s ease forwards;
    position:relative; z-index:1;
  }
  @keyframes popin{
    0%{opacity:0; transform:scale(.7)}
    100%{opacity:1; transform:scale(1)}
  }
  .star3d{
    margin-top:18px;
    width:min(60vw, 240px);
    aspect-ratio:1;
    position:relative;
    z-index:1;
    filter:drop-shadow(0 18px 60px rgba(255,200,60,.7));
    animation:starpop 1s cubic-bezier(.34,1.56,.64,1) forwards, starbob 4s 1s infinite ease-in-out;
  }
  @keyframes starpop{
    0%{transform:scale(.2) rotate(-30deg); opacity:0}
    60%{transform:scale(1.15) rotate(8deg); opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  @keyframes starbob{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-8px) rotate(2deg)}
  }
  .star3d svg{width:100%; height:100%; display:block;}
  .prize-num{
    margin-top:12px;
    font-family:'Russo One', sans-serif;
    font-size:80px;
    line-height:1;
    background:linear-gradient(180deg, #fff7d0 0%, var(--gold-1) 35%, var(--gold-2) 75%, var(--gold-3) 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 4px 24px rgba(255,200,60,.5);
    animation:popin 1s .3s ease backwards;
    position:relative; z-index:1;
  }
  .prize-lbl{
    margin-top:4px;
    font-family:'Russo One', sans-serif;
    font-size:18px;
    letter-spacing:10px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,200,60,.4);
    padding-left:10px;
    animation:popin 1s .5s ease backwards;
    position:relative; z-index:1;
  }
  .claim-btn{
    margin-top:36px;
    width:min(86vw, 380px);
    height:64px;
    border:0; border-radius:18px;
    font-family:'Manrope', sans-serif;
    font-weight:800; font-size:18px; letter-spacing:1px;
    text-transform:uppercase;
    color:#190628;
    background:linear-gradient(180deg, #fff7d0 0%, var(--gold-1) 45%, var(--gold-2) 100%);
    box-shadow:
      0 14px 32px rgba(255,180,40,.6),
      inset 0 2px 0 rgba(255,255,255,.7),
      inset 0 -3px 0 rgba(120,60,0,.25);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    animation:popin 1s .7s ease backwards;
    z-index:1;
  }
  .claim-btn::after{
    content:""; position:absolute; left:-60%; top:0;
    width:50%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.7), transparent);
    transform:skewX(-25deg);
    animation:shine 2s infinite;
  }
  .claim-btn:active{transform:translateY(2px) scale(.99)}

  .confetti{position:fixed; inset:0; pointer-events:none; z-index:9; overflow:hidden;}

  @media (max-height:680px){
    .title{font-size:30px}
    .wheel-wrap{margin-top:10px}
    .pill{margin-top:8px; padding:7px 14px}
    .pill .val{font-size:16px}
    .star3d{width:min(48vw, 200px)}
    .prize-num{font-size:64px}
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <span class="bigstar" style="top:8%; left:8%; font-size:24px;">⭐</span>
  <span class="bigstar" style="top:14%; right:10%; font-size:18px; animation-delay:1s;">⭐</span>
  <span class="bigstar" style="top:32%; left:5%; font-size:14px; animation-delay:2s;">✦</span>
  <span class="bigstar" style="top:25%; right:6%; font-size:14px; animation-delay:.5s;">✦</span>

  <div class="stage">
    <div class="topbadge">
      <span class="ico">⭐</span>
      <h1 class="title">ЗВЁЗДНАЯ&nbsp;РУЛЕТКА</h1>
    </div>
    <div class="subtitle">Один спин — и приз твой</div>

    <div class="pill">
      <span class="dot"></span>
      <span class="lbl">макс. приз</span>
      <span class="val">5000</span>
      <span class="star">⭐</span>
    </div>

    <div class="wheel-wrap">
      <div class="ring"></div>
      <div class="bulbs" id="bulbs"></div>
      <canvas id="wheel" width="700" height="700"></canvas>
      <div class="hub">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff7d0"/>
              <stop offset="55%" stop-color="#ffd152"/>
              <stop offset="100%" stop-color="#c97a00"/>
            </linearGradient>
          </defs>
          <polygon points="50,5 61,38 96,38 67,58 78,92 50,72 22,92 33,58 4,38 39,38" fill="url(#hg)" stroke="#6b3500" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="pointer">
        <svg width="44" height="56" viewBox="0 0 44 56">
          <defs>
            <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fff7d0"/>
              <stop offset="55%" stop-color="#ffd152"/>
              <stop offset="100%" stop-color="#c97a00"/>
            </linearGradient>
          </defs>
          <path d="M22 56 L0 10 Q22 -4 44 10 Z" fill="url(#pg)" stroke="#6b3500" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="22" cy="18" r="5" fill="#6b3500"/>
        </svg>
      </div>
    </div>

    <button class="spin-btn" id="spinBtn">КРУТИТЬ КОЛЕСО</button>
  </div>

  <div class="confetti" id="confetti"></div>

  <div class="win-screen" id="winScreen">
    <div class="rays"></div>
    <div class="win-title">🎉 ПОЗДРАВЛЯЕМ! 🎉</div>
    <div class="star3d">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff7d0"/>
            <stop offset="40%" stop-color="#ffd152"/>
            <stop offset="100%" stop-color="#c97a00"/>
          </linearGradient>
          <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,.95)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>
        <polygon points="100,10 122,76 192,76 134,118 156,184 100,144 44,184 66,118 8,76 78,76"
                 fill="url(#sf)" stroke="#6b3500" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="100,18 118,72 95,80 86,108 78,72" fill="url(#sh)" opacity=".75"/>
      </svg>
    </div>
    <div class="prize-num">5 000</div>
    <div class="prize-lbl">ЗВЁЗД</div>
    <button class="claim-btn" id="claimBtn">ЗАБРАТЬ ПРИЗ</button>
  </div>

<script>
"use strict";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg){
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#1f0848');
    tg.setBackgroundColor && tg.setBackgroundColor('#0c031f');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  } catch(e){}
}

const params = new URLSearchParams(location.search);
const BID = parseInt(params.get('bid') || '0', 10);
const SID = parseInt(params.get('sid') || '0', 10);

// ---------- Звёзды на фоне ----------
(function(){
  const c = document.getElementById('stars');
  const N = 80;
  for (let i=0; i<N; i++){
    const s = document.createElement('i');
    const size = 1 + Math.random()*2.2;
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.width = s.style.height = size + 'px';
    s.style.setProperty('--d', (2 + Math.random()*4) + 's');
    s.style.animationDelay = (Math.random()*4) + 's';
    s.style.opacity = (0.2 + Math.random()*0.7).toFixed(2);
    c.appendChild(s);
  }
})();

// ---------- Лампочки по кольцу ----------
(function(){
  const c = document.getElementById('bulbs');
  const N = 32;
  for (let i=0; i<N; i++){
    const a = (i/N)*Math.PI*2 - Math.PI/2;
    const x = 50 + Math.cos(a)*49;
    const y = 50 + Math.sin(a)*49;
    const sp = document.createElement('span');
    sp.style.left = x + '%';
    sp.style.top = y + '%';
    sp.style.animationDelay = (i*0.05).toFixed(2) + 's';
    c.appendChild(sp);
  }
})();

// ---------- Сектора рулетки (как на референсе) ----------
const SEGMENTS = [
  { label:'30',   color1:'#9b4dff', color2:'#5b22d4' },
  { label:'5000', color1:'#ffe78a', color2:'#ffb83d', jackpot:true },
  { label:'40',   color1:'#22c476', color2:'#0e8a4f' },
  { label:'250',  color1:'#ff9b1a', color2:'#c66a00' },
  { label:'30',   color1:'#ff5eb4', color2:'#c92e83' },
  { label:'30',   color1:'#4d8eff', color2:'#1f54c4' },
  { label:'150',  color1:'#e8324a', color2:'#a4001a' },
  { label:'40',   color1:'#4de4ff', color2:'#1eaecf' },
];
const JACKPOT_INDEX = SEGMENTS.findIndex(s => s.jackpot);

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CX = W/2, CY = H/2;
const R_OUT = W*0.485;
const R_IN = W*0.11;
let rotation = 0;

function drawWheel(){
  ctx.clearRect(0,0,W,H);
  const N = SEGMENTS.length;
  const step = (Math.PI*2)/N;

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(rotation);

  for (let i=0; i<N; i++){
    const a0 = i*step - Math.PI/2;
    const a1 = a0 + step;
    const seg = SEGMENTS[i];

    // Заливка
    const grad = ctx.createRadialGradient(0,0,R_IN, 0,0,R_OUT);
    grad.addColorStop(0, seg.color1);
    grad.addColorStop(1, seg.color2);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R_OUT,a0,a1);
    ctx.closePath();
    ctx.fill();

    // Лёгкий внутренний глянец сверху
    ctx.save();
    const gloss = ctx.createLinearGradient(0,-R_OUT, 0, R_OUT*0.2);
    gloss.addColorStop(0, 'rgba(255,255,255,.18)');
    gloss.addColorStop(0.6, 'rgba(255,255,255,0)');
    ctx.fillStyle = gloss;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,R_OUT,a0,a1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Доп. золотой блик для джекпота
    if (seg.jackpot){
      const glo = ctx.createRadialGradient(
        Math.cos((a0+a1)/2)*R_OUT*0.6, Math.sin((a0+a1)/2)*R_OUT*0.6, 5,
        Math.cos((a0+a1)/2)*R_OUT*0.6, Math.sin((a0+a1)/2)*R_OUT*0.6, R_OUT*0.5,
      );
      glo.addColorStop(0, 'rgba(255,255,255,.55)');
      glo.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = glo;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,R_OUT,a0,a1);
      ctx.closePath();
      ctx.fill();
    }

    // Тёмная окантовка между секторами
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a0)*R_OUT, Math.sin(a0)*R_OUT);
    ctx.stroke();
    ctx.restore();

    // Текст
    const mid = (a0+a1)/2;
    ctx.save();
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = seg.jackpot ? '#3a1c00' : '#ffffff';
    ctx.font = 'bold ' + (seg.jackpot ? '44px' : '38px') + ' Russo One, sans-serif';
    if (seg.jackpot){
      ctx.shadowColor = 'rgba(255,255,255,.8)';
      ctx.shadowBlur = 12;
    } else {
      ctx.shadowColor = 'rgba(0,0,0,.45)';
      ctx.shadowBlur = 4;
    }
    ctx.fillText(seg.label, R_OUT - 26, 0);
    ctx.restore();
  }

  // Внутренний круг
  ctx.beginPath();
  ctx.arc(0,0,R_IN,0,Math.PI*2);
  const innerGrad = ctx.createRadialGradient(0,0,0, 0,0,R_IN);
  innerGrad.addColorStop(0, '#3a1568');
  innerGrad.addColorStop(1, '#0a0420');
  ctx.fillStyle = innerGrad;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,213,82,.5)';
  ctx.stroke();

  ctx.restore();
}
drawWheel();

// ---------- Анимация ----------
let spinning = false;
function easeOutQuint(t){ return 1 - Math.pow(1 - t, 5); }

function spinTo(targetIndex, duration, cb){
  if (spinning) return;
  spinning = true;
  const N = SEGMENTS.length;
  const step = (Math.PI*2)/N;
  const baseTarget = -(targetIndex*step + step/2);
  const jitter = (Math.random() - 0.5) * step * 0.5;
  const fullTurns = 6 + Math.floor(Math.random()*2);
  const finalRot = baseTarget + fullTurns*Math.PI*2 + jitter;

  const start = performance.now();
  const initRot = rotation;
  const delta = finalRot - (initRot % (Math.PI*2));
  const normalized = ((delta % (Math.PI*2)) + Math.PI*2) % (Math.PI*2) + fullTurns*Math.PI*2;

  let lastTick = -1;
  function tick(now){
    const t = Math.min(1, (now - start)/duration);
    const k = easeOutQuint(t);
    rotation = initRot + normalized*k;
    drawWheel();
    // Тик-тик звук имитируется хаптиком на каждом секторе
    const segIdx = Math.floor(((rotation + Math.PI/2) / step) * -1 + N*1000) % N;
    if (segIdx !== lastTick){
      lastTick = segIdx;
      if (t < 0.95){
        try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch(e){}
      }
    }
    if (t < 1){
      requestAnimationFrame(tick);
    } else {
      spinning = false;
      cb && cb();
    }
  }
  requestAnimationFrame(tick);
}

// ---------- Конфетти ----------
function spawnConfetti(){
  const c = document.getElementById('confetti');
  c.innerHTML = '';
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute; inset:0; width:100%; height:100%;';
  c.appendChild(canvas);
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const cctx = canvas.getContext('2d');
  const colors = ['#fff7d0','#ffd152','#ff3aa1','#7a3eff','#4de4ff','#22c476','#ff9b1a'];
  const parts = [];
  for (let i=0; i<140; i++){
    parts.push({
      x: Math.random()*canvas.width,
      y: -10 - Math.random()*canvas.height*0.4,
      vx: (Math.random()-0.5)*5,
      vy: 2 + Math.random()*5,
      r: 5 + Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.25,
      shape: Math.random()<0.5 ? 'rect':'star',
    });
  }
  let frames = 0;
  function tick(){
    frames++;
    cctx.clearRect(0,0,canvas.width,canvas.height);
    for (const p of parts){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.07;
      p.rot += p.vr;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.fillStyle = p.color;
      if (p.shape === 'rect'){
        cctx.fillRect(-p.r/2, -p.r/3, p.r, p.r*0.6);
      } else {
        // Звезда
        cctx.beginPath();
        const spikes = 5;
        for (let i=0; i<spikes*2; i++){
          const r = i%2===0 ? p.r/2 : p.r/4;
          const a = (i/(spikes*2))*Math.PI*2 - Math.PI/2;
          const x = Math.cos(a)*r, y = Math.sin(a)*r;
          if (i===0) cctx.moveTo(x,y); else cctx.lineTo(x,y);
        }
        cctx.closePath();
        cctx.fill();
      }
      cctx.restore();
    }
    if (frames < 320){
      requestAnimationFrame(tick);
    } else {
      c.innerHTML = '';
    }
  }
  requestAnimationFrame(tick);
}

// ---------- Логика ----------
let claimed = false;
let autoTimer = null;

async function notifyWin(){
  if (claimed) return;
  claimed = true;
  if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  try {
    await fetch('/api/win', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        bid: BID, sid: SID,
        init_data: (tg && tg.initData) || '',
      }),
    });
  } catch(e){}
  setTimeout(() => {
    try { tg && tg.close && tg.close(); } catch(e){}
  }, 200);
}

document.getElementById('spinBtn').addEventListener('click', () => {
  if (spinning) return;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('heavy'); } catch(e){}
  spinTo(JACKPOT_INDEX, 5400, () => {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
    spawnConfetti();
    document.getElementById('winScreen').classList.add('show');
    autoTimer = setTimeout(notifyWin, 5000);
  });
});

document.getElementById('claimBtn').addEventListener('click', () => {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('medium'); } catch(e){}
  notifyWin();
});
